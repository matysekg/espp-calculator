<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
        <script defer type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>
        <title>JSON to Python Dictionary</title>
        <style>
            .data-table {
                border-collapse: collapse;
                width: 100%;
                margin-top: 20px;
            }
            .data-table th, .data-table td {
                border: 1px solid #ddd;
                padding: 8px;
            }
            .data-table th {
                background-color: #f2f2f2;
                text-align: left;
            }
        </style>
    </head>
<body>
    <h1>Upload a JSON File</h1>
    <input type="file" id="jsonFile" accept=".json" />
    <button id="uploadButton">Process the file</button>

    <div id="output" style="margin-top: 20px; white-space: pre-wrap;"></div>

    <!-- Placeholder for DataFrames -->
    <div id="saleTable"></div>
    <div id="dividendTable"></div>

    <section class="pyscript">
        <script type="py" src="index.py" config="./pyscript.toml"></script>
    </section>
</body>
</html>
